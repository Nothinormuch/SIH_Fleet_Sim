name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Python lint
        run: ruff check .
      - name: Python tests
        run: python -m pytest -q
      - name: Import and bytecode validation
        run: python -m compileall -q src backend *.py
      - name: Frontend JavaScript syntax
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Short authenticated multi-process smoke test
        run: python edge_demo.py --robots 3 --duration 0.4 --port 26231
